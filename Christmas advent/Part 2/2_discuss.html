:root{--ink:#233d36;--forest:#264b3e;--gold:#b9945a;--rose:#a9443d;--cream:#fffdf8;--paper:#f8f6ef}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:'DM Sans',Arial,sans-serif;background:radial-gradient(ellipse at 10% 5%,#f0f5ed 0,transparent 40%),linear-gradient(130deg,#fcfaf3,#f3f5f0 55%,#f9f3ea);min-height:100vh} .wrap{max-width:1000px;margin:0 auto;padding:25px 22px 65px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.19em;color:#9f5042;text-transform:uppercase}.hero{position:relative;overflow:hidden;border-radius:26px;border:1px solid #e2d8c7;background:#fff;box-shadow:0 15px 50px #42584a13}.hero img{width:100%;height:310px;object-fit:cover;object-position:center;display:block}.hero-label{position:absolute;left:30px;top:27px;background:#fffdf2ed;border:1px solid #f2e9dc;backdrop-filter:blur(9px);padding:15px 24px;border-radius:17px;box-shadow:0 6px 18px #17352517}.hero-label h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(27px,4vw,42px);font-weight:500;margin:5px 0 0;color:#1b4339}.main{max-width:875px;margin:27px auto 0}.card{background:#fffefaf5;border:1px solid #e8e1d5;border-radius:23px;padding:clamp(22px,4vw,43px);margin:22px 0;box-shadow:0 12px 36px #4151410e}.section-head{display:flex;gap:14px;align-items:baseline;margin:0 0 22px}.num{font-family:Georgia,serif;font-weight:700;color:#bd3d3d;font-size:42px;line-height:1}.section-head h2{font:500 clamp(23px,3vw,33px)/1.3 'Playfair Display',Georgia,serif;margin:0}.story{font-size:17px;line-height:1.94;color:#34463e}.story p{margin:0 0 21px}.story p:last-child{margin:0} .hint{font-size:14px;color:#65786d;line-height:1.6}.line{height:1px;background:#e9e2d5;margin:27px 0}.question{font-size:clamp(18px,2.4vw,23px);font-weight:600;line-height:1.48;margin:14px 0 21px}.progress{color:#9b6856;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.bar{height:7px;background:#ebe9de;border-radius:12px;overflow:hidden;margin:9px 0 23px}.bar i{display:block;width:20%;height:100%;background:linear-gradient(90deg,#70927b,#b4c9a4);transition:width .3s}.choices{display:flex;gap:13px;flex-wrap:wrap}.btn{border:0;background:#2b4c3e;color:white;display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:15px 25px;border-radius:35px;font:700 15px 'DM Sans',Arial,sans-serif;cursor:pointer;text-decoration:none;transition:transform .17s,background .17s}.btn:hover{background:#37624e;transform:translateY(-1px)}.btn:focus-visible,.option:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #e8ad61;outline-offset:3px}.option{background:white;color:#254d3f;border:1.5px solid #b5c5b9;min-width:130px;padding:14px 20px;border-radius:14px;font:700 17px 'DM Sans',Arial,sans-serif;cursor:pointer;transition:all .2s}.option:hover{border-color:#2b4c3e;background:#f1f7ef}.option.chosen{background:#315744;color:white;border-color:#315744}.option:disabled{cursor:default}.feedback{margin:17px 0 0;min-height:24px;font-size:15px;color:#385a47;font-weight:600}.hidden{display:none!important}.summary{padding:18px;background:#f0f6ee;border-radius:15px}.field{margin:22px 0 28px}label{font-size:19px;line-height:1.65;font-weight:600;display:block;margin-bottom:11px}textarea{width:100%;resize:vertical;min-height:150px;border:1px solid #cdd6ca;border-radius:15px;padding:17px 18px;font:16px/1.7 'DM Sans',Arial,sans-serif;color:#243d34;background:#fff;outline:none}textarea:focus{border-color:#456b55;box-shadow:0 0 0 4px #89ad8529}.save{margin-top:6px;font-size:13px;color:#668173}.nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:13px;margin-top:32px}.back{color:#476858;text-decoration:none;font-weight:600}.back:hover{text-decoration:underline}.audio-box{border:1px solid #e3e6dc;border-radius:16px;background:#f4f7f2;padding:22px;margin:18px 0}audio{width:100%;display:block;accent-color:#2d5541}details{margin-top:22px;border:1px solid #dfdacf;background:#fffdf7;border-radius:16px;padding:0 18px}summary{cursor:pointer;padding:19px 4px;font-weight:700;color:#315744}details[open] summary{border-bottom:1px solid #ebe4d6}.script{padding:18px 5px 8px;white-space:normal;line-height:1.83;color:#38463e;font-size:15.5px}.script p{margin:0 0 13px}.title-options{display:grid;gap:12px;margin-top:19px}.title-options .option{text-align:left;font-weight:600;width:100%;max-width:480px}.tag{display:inline-flex;align-items:center;background:#f2eee3;border-radius:20px;padding:6px 12px;color:#8a6546;font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700}footer{text-align:center;color:#8d978b;font-size:12px;padding:23px 0 0}@media(max-width:640px){.wrap{padding:12px 12px 42px}.hero img{height:210px}.hero-label{top:13px;left:13px;padding:12px 16px;max-width:calc(100% - 26px)}.card{padding:23px 19px}.section-head{gap:10px}.num{font-size:34px}.story{font-size:16px}.choices .option{flex:1}.nav .btn{width:100%}}
