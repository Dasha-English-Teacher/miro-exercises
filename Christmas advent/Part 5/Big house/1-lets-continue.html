';m.setAttribute('aria-label','Move event '+(i+1)+(d<0?' up':' down'));m.disabled=i+d<0||i+d>=6;m.onclick=()=>{[order[i],order[i+d]]=[order[i+d],order[i]];picked=null;clear();render();};row.append(m);});$('events').append(row);});}function clear(){$('score').textContent='';document.querySelectorAll('.is-right,.is-wrong').forEach(e=>e.classList.remove('is-right','is-wrong'));}render();$('check').onclick=()=>{clear();const chosen=document.querySelector('input[name=title]:checked');const ok=chosen?.value==='2';if(chosen)chosen.parentElement.classList.add(ok?'is-right':'is-wrong');const answers=[{q:'Best title',a:chosen?chosen.parentElement.textContent:'',ok}];order.forEach((v,i)=>{const good=v===key[i];$('events').children[i].classList.add(good?'is-right':'is-wrong');answers.push({q:'Event at position '+(i+1),a:events[v],ok:good});});const n=answers.filter(a=>a.ok).length;$('score').textContent=`Score: ${n} / 7`;if(window.reportResult)reportResult(n,7,answers);};$('show').onclick=()=>{if(window.reportAnswerKeyShown)reportAnswerKeyShown();document.querySelector('input[value="2"]').checked=true;order=[...key];picked=null;clear();render();};$('again').onclick=()=>{document.querySelectorAll('input[name=title]').forEach(e=>e.checked=false);order=[0,1,2,3,4,5];picked=null;clear();render();};</script><script src="https://dashaenglish.com/assets/report.js"></script></body></html>
